name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token by default
permissions:
  contents: read

jobs:
  # Fail if any .tf file is not formatted
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -check -recursive

  # Check that each stack is valid Terraform, without touching AWS
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [bootstrap, cluster, platform]
    defaults:
      run:
        working-directory: infrastructure/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
      - run: terraform init -backend=false
      - run: terraform validate

  # Scan the full git history for secrets
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
